name: Release

# Publishing happens when a GitHub release is published for a tag of the form v<version>. The release runs the full
# CI pipeline on that exact revision and publishes the package artifact that pipeline verified, after checking that the
# tag, the package version and the recorded source revision all agree.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: nuget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: release

      - name: Check that tag, version and source revision correspond
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Nast.Html2Pdf/Nast.Html2Pdf.csproj | head -1)"
          test "$tag" = "$project_version" || { echo "::error::tag $GITHUB_REF_NAME does not match project version $project_version"; exit 1; }
          test -f "release/Nast.Html2Pdf.$tag.nupkg" || { echo "::error::verified package for $tag not found"; exit 1; }
          test "$(cat release/SOURCE_REVISION)" = "$GITHUB_SHA" || { echo "::error::verified package was built from a different revision"; exit 1; }
          unzip -p "release/Nast.Html2Pdf.$tag.nupkg" Nast.Html2Pdf.nuspec | grep -q "commit=\"$GITHUB_SHA\"" || { echo "::error::nuspec commit mismatch"; exit 1; }
          (cd release && sha256sum -c SHA256SUMS)

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY" || { echo "::error::NUGET_API_KEY secret is not configured"; exit 1; }
          dotnet nuget push "release/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

      - name: Attach verified artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/*.nupkg release/*.snupkg release/SHA256SUMS release/SOURCE_REVISION --clobber
